<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcceptedAI — Find a Vacancy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }
  h2 { font-size: 18px; margin-bottom: 4px; }
  .hint { color: var(--tg-theme-hint-color, #999999); font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000000);
    font-size: 15px;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  button.secondary {
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #000000);
  }
  button.link {
    width: auto;
    background: none;
    color: var(--tg-theme-link-color, #2481cc);
    padding: 4px 0;
    margin-top: 4px;
    font-weight: 400;
    text-align: left;
  }
  .row { display: flex; gap: 8px; }
  .row button { margin-top: 0; }
  #result { margin-top: 20px; }
  .card {
    border: 1px solid var(--tg-theme-hint-color, #dddddd);
    border-radius: 10px;
    padding: 14px;
  }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .company { color: var(--tg-theme-hint-color, #999999); font-size: 13px; margin-bottom: 8px; }
  .card a { color: var(--tg-theme-link-color, #2481cc); }
  .error { color: #d33; font-size: 14px; }
  .chip {
    display: inline-block;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    border-radius: 20px;
    padding: 8px 14px;
    margin: 4px 4px 0 0;
    font-size: 14px;
    cursor: pointer;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
  }
  .selected-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .selected-title b { font-size: 15px; }
  [hidden] { display: none !important; }
  input[type="file"] { border: none; padding: 8px 0; background: none; }
</style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 id="greeting">AcceptedAI</h2>
    <button id="nav-applications" class="link" onclick="showApplications()" hidden style="margin:0;">📋 My Applications</button>
  </div>

  <div id="loading-gate" class="hint">Loading…</div>

  <div id="cv-gate" hidden>
    <div class="hint">Upload your CV so I can search and score vacancies against it.</div>
    <label for="cv_file">CV (PDF or DOCX)</label>
    <input type="file" id="cv_file" accept=".pdf,.docx" />
    <button id="upload_btn" onclick="uploadCV()">📄 Upload CV</button>
    <div id="upload_result"></div>
  </div>

  <div id="title-screen" hidden>
    <div class="hint">What position are you looking for?</div>
    <div class="row">
      <button onclick="showManualTitle()">✍️ Type my own</button>
      <button class="secondary" onclick="suggestTitles()">🤖 Suggest from my CV</button>
    </div>

    <div id="manual-title-box" hidden>
      <label for="manual_title">Job title</label>
      <input id="manual_title" placeholder="e.g. Data Analyst" />
      <button onclick="pickTitle(document.getElementById('manual_title').value.trim())">Next →</button>
    </div>

    <div id="suggested-titles-box" hidden>
      <div id="title-chips"></div>
      <button class="link" onclick="suggestTitles()">🔄 Suggest different titles</button>
    </div>

    <div id="title-error"></div>
  </div>

  <div id="search-screen" hidden>
    <div class="selected-title">
      <span>Searching for <b id="chosen-title-label"></b></span>
      <button class="link" onclick="backToTitleScreen()" style="margin:0;">change</button>
    </div>

    <label for="location">Location</label>
    <input id="location" placeholder="e.g. Tashkent, Remote, Europe" />

    <button id="search_btn" onclick="search()">🔍 Search</button>

    <div id="result"></div>
  </div>

  <div id="applications-screen" hidden>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div class="hint" style="margin:0;">Your tracked applications</div>
      <button class="link" onclick="showScreen('title-screen')" style="margin:0;">← back</button>
    </div>
    <div id="applications-list"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById("greeting").textContent = `Hi ${user.first_name}`;
      }
    }

    const state = { jobTitle: "", seenCompanies: [], searchCount: 0 };
    const MAX_SEARCHES = 3;

    function showScreen(id) {
      for (const s of ["loading-gate", "cv-gate", "title-screen", "search-screen", "applications-screen"]) {
        document.getElementById(s).hidden = (s !== id);
      }
    }

    async function checkCVAndRoute() {
      if (!tg || !tg.initData) {
        document.getElementById("loading-gate").innerHTML =
          '<div class="error">Open this from the Telegram bot, not a regular browser.</div>';
        return;
      }
      try {
        const res = await fetch("/api/cv-status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: tg.initData }),
        });
        if (!res.ok) throw new Error("status check failed");
        const data = await res.json();
        showScreen(data.has_cv ? "title-screen" : "cv-gate");
        document.getElementById("nav-applications").hidden = false;
      } catch (err) {
        console.error("CV status check failed:", err);
        document.getElementById("loading-gate").innerHTML =
          `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Couldn't load your profile."))}</div>`;
      }
    }
    checkCVAndRoute();

    async function uploadCV() {
      const fileInput = document.getElementById("cv_file");
      const resultEl = document.getElementById("upload_result");
      const btn = document.getElementById("upload_btn");
      const file = fileInput.files[0];

      if (!file) {
        resultEl.innerHTML = '<div class="error">Choose a PDF or DOCX file first.</div>';
        return;
      }

      btn.disabled = true;
      resultEl.innerHTML = '<div class="hint">📄 Reading your CV…</div>';

      const formData = new FormData();
      formData.append("init_data", tg.initData);
      formData.append("file", file);

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      try {
        const res = await fetch("/api/upload-cv", { method: "POST", body: formData, signal: controller.signal });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          console.error("Upload failed:", res.status, body);
          const err = new Error(body.detail || "");
          if (res.status === 401) err.sessionExpired = true;
          throw err;
        }
        showScreen("title-screen");
      } catch (err) {
        console.error("CV upload failed:", err);
        resultEl.innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Upload failed, try again."))}</div>`;
      } finally {
        clearTimeout(timeout);
        btn.disabled = false;
      }
    }

    function showManualTitle() {
      document.getElementById("suggested-titles-box").hidden = true;
      document.getElementById("manual-title-box").hidden = false;
    }

    async function suggestTitles() {
      document.getElementById("manual-title-box").hidden = true;
      const box = document.getElementById("suggested-titles-box");
      const chipsEl = document.getElementById("title-chips");
      const errEl = document.getElementById("title-error");
      box.hidden = false;
      errEl.innerHTML = "";
      chipsEl.innerHTML = '<div class="hint">🤖 Analyzing your CV…</div>';

      try {
        const data = await callApi("/api/suggest-titles", {});
        chipsEl.innerHTML = "";
        for (const title of data.titles) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = title;
          chip.onclick = () => pickTitle(title);
          chipsEl.appendChild(chip);
        }
      } catch (err) {
        console.error("Suggest titles failed:", err);
        chipsEl.innerHTML = "";
        errEl.innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Couldn't get suggestions, try again."))}</div>`;
      }
    }

    function pickTitle(title) {
      if (!title) {
        document.getElementById("title-error").innerHTML = '<div class="error">Enter a job title first.</div>';
        return;
      }
      state.jobTitle = title;
      state.seenCompanies = [];
      state.searchCount = 0;
      document.getElementById("chosen-title-label").textContent = title;
      document.getElementById("result").innerHTML = "";
      showScreen("search-screen");
    }

    function backToTitleScreen() {
      showScreen("title-screen");
    }

    const STATUS_LABELS = {
      applied: "Applied", phone_screen: "Phone screen", tech_interview: "Tech interview",
      offer: "Offer 🎉", rejected: "Rejected", ghosted: "Ghosted",
    };

    async function showApplications() {
      showScreen("applications-screen");
      const listEl = document.getElementById("applications-list");
      listEl.innerHTML = '<div class="hint">Loading…</div>';

      try {
        const data = await callApi("/api/applications", {});
        renderApplications(data.applications);
      } catch (err) {
        console.error("Loading applications failed:", err);
        listEl.innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Couldn't load your applications."))}</div>`;
      }
    }

    function renderApplications(applications) {
      const listEl = document.getElementById("applications-list");
      if (!applications || applications.length === 0) {
        listEl.innerHTML = '<div class="hint">Nothing tracked yet — like a vacancy and apply to see it here.</div>';
        return;
      }
      listEl.innerHTML = applications.map(a => {
        const date = new Date(a.created_at).toLocaleDateString();
        const status = STATUS_LABELS[a.status] || a.status;
        const scoreLine = (a.match_score !== null && a.match_score !== undefined)
          ? `<div>${a.match_score}% match</div>` : "";
        return `
          <div class="card" style="margin-bottom:8px;">
            <h3>${escapeHtml(a.title)}</h3>
            <div class="company">${escapeHtml(a.company)}${a.location ? " · " + escapeHtml(a.location) : ""}</div>
            ${scoreLine}
            <div>Status: <b>${escapeHtml(status)}</b> · ${escapeHtml(date)}</div>
            ${a.url ? `<a href="${a.url}" target="_blank">View posting →</a>` : ""}
          </div>
        `;
      }).join("");
    }

    async function search() {
      const location = document.getElementById("location").value.trim() || "Any";
      const resultEl = document.getElementById("result");
      const btn = document.getElementById("search_btn");

      if (!tg || !tg.initData) {
        resultEl.innerHTML = '<div class="error">Open this from the Telegram bot, not a regular browser.</div>';
        return;
      }
      if (state.searchCount >= MAX_SEARCHES) {
        resultEl.innerHTML = '<div class="hint">You\'ve reached the search limit for this session — pick one of the postings above, or change the title to search again.</div>';
        return;
      }

      btn.disabled = true;
      resultEl.innerHTML = `<div class="hint">🔎 Searching for <b>${escapeHtml(state.jobTitle)}</b> in <b>${escapeHtml(location)}</b>… usually takes 15–30 seconds.</div>`;

      try {
        const data = await callApi("/api/search", {
          job_title: state.jobTitle,
          location: location,
          seen_companies: state.seenCompanies,
        });
        state.searchCount += 1;
        renderResult(data.vacancies);
      } catch (err) {
        console.error("Search error:", err);
        resultEl.innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Search failed on our end. Please try again in a moment."))}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    const MAX_IMPROVES = 2;

    function renderResult(vacancies) {
      const resultEl = document.getElementById("result");
      if (!vacancies || vacancies.length === 0) {
        resultEl.innerHTML = '<div class="hint">No matching posting found — try different criteria.</div>';
        return;
      }
      const v = vacancies[0];
      state.currentVacancy = v;
      state.improveCount = 0;
      state.seenCompanies.push(v.company);
      const canSearchAgain = state.searchCount < MAX_SEARCHES;

      resultEl.innerHTML = `
        <div class="card">
          <h3>${escapeHtml(v.title)}</h3>
          <div class="company">${escapeHtml(v.company)} · ${escapeHtml(v.location)}</div>
          <p>${escapeHtml(v.summary)}</p>
          <a href="${v.url}" target="_blank">View posting →</a>
        </div>
        <div class="hint" style="margin-top:4px;">⚠️ This link is AI-found and may occasionally be outdated or already filled.</div>
        <div class="hint" style="margin-top:12px;">Like this one?</div>
        <div class="row">
          <button onclick="likeVacancy()">👍 Yes, I like it</button>
          ${canSearchAgain ? '<button class="secondary" onclick="search()">🔄 Search again</button>' : ''}
        </div>
        ${!canSearchAgain ? '<div class="hint" style="margin-top:8px;">Search limit reached for this title — change it above to search again.</div>' : ''}
        <div id="action-area"></div>
      `;
    }

    function actionArea() {
      return document.getElementById("action-area");
    }

    function likeVacancy() {
      actionArea().innerHTML = `
        <div class="hint" style="margin-top:12px;">How do you want to proceed?</div>
        <div class="row">
          <button onclick="applyDirectly()">✅ Apply directly</button>
          <button class="secondary" onclick="checkFit()">📊 Check my CV fit</button>
        </div>
      `;
    }

    async function callApi(path, body, btn) {
      if (btn) btn.disabled = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      try {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: tg.initData, ...body }),
          signal: controller.signal,
        });
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          console.error("API call failed:", path, res.status, errBody);
          const err = new Error(errBody.detail || "");
          if (res.status === 401) err.sessionExpired = true;
          throw err;
        }
        return await res.json();
      } finally {
        clearTimeout(timeout);
        if (btn) btn.disabled = false;
      }
    }

    // Maps any thrown error into a specific, non-technical message. Never
    // shows raw server/network text to the user (that goes to console only).
    function friendlyError(err, fallback) {
      if (err && err.name === "AbortError") {
        return "That took too long and timed out — please try again.";
      }
      if (err instanceof TypeError) {
        return "Couldn't connect — check your internet connection and try again.";
      }
      if (err && err.sessionExpired) {
        return "Your session expired — close this and reopen it from the bot.";
      }
      if (err && typeof err.message === "string" && err.message.trim()) {
        return err.message;
      }
      return fallback || "Something went wrong. Please try again.";
    }

    async function applyDirectly() {
      actionArea().innerHTML = '<div class="hint">Saving…</div>';
      try {
        await callApi("/api/apply", { vacancy: state.currentVacancy, score: null });
        renderSaved();
      } catch (err) {
        console.error("Apply failed:", err);
        actionArea().innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Couldn't save your application, try again."))}</div>`;
      }
    }

    async function checkFit() {
      actionArea().innerHTML = '<div class="hint">📊 Comparing your CV to this vacancy…</div>';
      try {
        const score = await callApi("/api/score-vacancy", { vacancy: state.currentVacancy });
        state.lastScore = score;
        renderScoreResult(score);
      } catch (err) {
        console.error("Scoring failed:", err);
        actionArea().innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Couldn't score your CV, try again."))}</div>`;
      }
    }

    function renderScoreResult(score) {
      const matched = (score.matched || []).join(", ") || "none";
      const missing = (score.missing || []).join(", ") || "none";
      actionArea().innerHTML = `
        <div class="card" style="margin-top:12px;">
          <h3>${score.score}% Match</h3>
          <p>${escapeHtml(score.verdict || "")}</p>
          <div>✅ <b>Matched:</b> ${escapeHtml(matched)}</div>
          <div>❌ <b>Missing:</b> ${escapeHtml(missing)}</div>
        </div>
        <div class="row">
          <button onclick="applyDirectly()">✅ Apply anyway</button>
          ${state.improveCount < MAX_IMPROVES ? '<button class="secondary" onclick="showLevelPicker()">📝 Get recommendations</button>' : ''}
        </div>
      `;
    }

    function showLevelPicker() {
      actionArea().insertAdjacentHTML("beforeend", `
        <div class="hint" style="margin-top:12px;">What's your level for this role?</div>
        <div class="row">
          <button onclick="getRecommendations('Junior')">Junior</button>
          <button onclick="getRecommendations('Mid')">Mid</button>
          <button onclick="getRecommendations('Senior')">Senior</button>
        </div>
      `);
    }

    async function getRecommendations(level) {
      actionArea().innerHTML = '<div class="hint">📝 Working out what to fix…</div>';
      try {
        const data = await callApi("/api/cv-recommendations", { vacancy: state.currentVacancy, level });
        renderRecommendations(data.fixes);
      } catch (err) {
        console.error("Recommendations failed:", err);
        actionArea().innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Couldn't get recommendations, try again."))}</div>`;
      }
    }

    function renderRecommendations(fixes) {
      const cards = (fixes || []).map(f => `
        <div class="card" style="margin-top:8px;">
          <p><b>Issue:</b> ${escapeHtml(f.issue)}</p>
          ${f.before ? `<p><i>Before:</i> ${escapeHtml(f.before)}</p>` : ""}
          <p><i>After:</i> ${escapeHtml(f.after)}</p>
        </div>
      `).join("");

      actionArea().innerHTML = `
        ${cards}
        <div class="hint" style="margin-top:12px;">Ready to apply, or want to improve your CV first?</div>
        <div class="row">
          <button onclick="applyDirectly()">✅ Apply now</button>
          ${state.improveCount < MAX_IMPROVES ? '<button class="secondary" onclick="showImproveUpload()">📄 Improve CV</button>' : ''}
        </div>
      `;
    }

    function showImproveUpload() {
      actionArea().innerHTML = `
        <div class="hint">Upload your updated CV (PDF or DOCX).</div>
        <input type="file" id="improve_cv_file" accept=".pdf,.docx" />
        <button onclick="uploadImprovedCV()">📄 Upload improved CV</button>
        <div id="improve_result"></div>
      `;
    }

    async function uploadImprovedCV() {
      const fileInput = document.getElementById("improve_cv_file");
      const resultEl = document.getElementById("improve_result");
      const file = fileInput.files[0];
      if (!file) {
        resultEl.innerHTML = '<div class="error">Choose a PDF or DOCX file first.</div>';
        return;
      }

      resultEl.innerHTML = '<div class="hint">📄 Reading your updated CV…</div>';
      const formData = new FormData();
      formData.append("init_data", tg.initData);
      formData.append("file", file);

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      try {
        const res = await fetch("/api/upload-cv", { method: "POST", body: formData, signal: controller.signal });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          console.error("Improved CV upload failed:", res.status, body);
          const err = new Error(body.detail || "");
          if (res.status === 401) err.sessionExpired = true;
          throw err;
        }
        state.improveCount += 1;
        renderPostImproveChoice();
      } catch (err) {
        console.error("Improved CV upload failed:", err);
        resultEl.innerHTML = `<div class="error">⚠️ ${escapeHtml(friendlyError(err, "Upload failed, try again."))}</div>`;
      } finally {
        clearTimeout(timeout);
      }
    }

    function renderPostImproveChoice() {
      if (state.improveCount >= MAX_IMPROVES) {
        actionArea().innerHTML = `
          <div class="hint">CV updated. You've reached the improve limit for this vacancy — ready to apply.</div>
          <button onclick="applyDirectly()">✅ Apply now</button>
        `;
        return;
      }
      actionArea().innerHTML = `
        <div class="hint">CV updated. Apply now, or check your new match % first?</div>
        <div class="row">
          <button onclick="applyDirectly()">✅ Apply now</button>
          <button class="secondary" onclick="checkFit()">📊 Check match again</button>
        </div>
      `;
    }

    function renderSaved() {
      actionArea().innerHTML = `
        <div class="hint">✅ Saved to your tracked applications.</div>
        <button class="secondary" onclick="showApplications()">📋 View my applications</button>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }
  </script>
</body>
</html>

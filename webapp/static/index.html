<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcceptedAI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 id="greeting">AcceptedAI</h2>
    <div style="display:flex; gap:12px; align-items:center;">
      <button id="nav-checks" class="link" onclick="showProfile()" hidden style="margin:0;"></button>
      <button id="nav-applications" class="link" onclick="showApplications()" hidden style="margin:0;"></button>
    </div>
  </div>

  <div id="loading-gate" class="hint">Loading…</div>

  <div id="welcome-screen" hidden>
    <div class="hint" id="welcome-body"></div>
    <button id="welcome-continue-btn" onclick="showScreen('home-screen')"></button>
  </div>

  <div id="cv-gate" hidden>
    <div class="screen-header">
      <div class="hint" id="cv-gate-hint"></div>
      <button id="btn-cv-gate-back" class="back-btn" onclick="goHome()"></button>
    </div>
    <label for="cv_file" id="cv-file-label"></label>
    <input type="file" id="cv_file" accept=".pdf,.docx" />
    <button id="upload_btn" onclick="uploadCV()"></button>
    <div id="upload_result"></div>
  </div>

  <div id="home-screen" hidden>
    <div class="hint" id="home-hint"></div>
    <button class="menu-option" onclick="goToVacancySearch()">
      <div id="home-vacancy-option"></div>
      <div class="hint" id="home-vacancy-hint"></div>
    </button>
    <button class="menu-option" onclick="goToAnalysis()">
      <div id="home-analyze-option"></div>
      <div class="hint" id="home-analyze-hint"></div>
    </button>
  </div>

  <div id="profile-screen" hidden>
    <div class="screen-header">
      <div class="hint" id="profile-title"></div>
      <button id="btn-profile-back" class="back-btn" onclick="goHome()"></button>
    </div>
    <div id="profile-content"></div>
  </div>

  <div id="my-cvs-screen" hidden>
    <div class="screen-header">
      <div class="hint" id="my-cvs-title"></div>
      <button id="btn-my-cvs-back" class="back-btn" onclick="showProfile()"></button>
    </div>
    <div id="my-cvs-list"></div>
    <div class="prompt-block" id="my-cvs-upload-label"></div>
    <input type="file" id="new_cv_file" accept=".pdf,.docx" />
    <button id="upload_new_cv_btn" onclick="uploadNewCv()"></button>
    <div id="my-cvs-upload-result"></div>
  </div>

  <div id="analysis-screen" hidden>
    <div class="screen-header">
      <div class="hint" id="analysis-title"></div>
      <button id="btn-analysis-back" class="back-btn" onclick="goHome()"></button>
    </div>
    <div id="jd-input-box">
      <label for="jd_text" id="jd-label"></label>
      <textarea id="jd_text"></textarea>
      <button id="analyze_btn" onclick="analyzeCV()"></button>
    </div>
    <div id="analysis-result"></div>
  </div>

  <div id="title-screen" hidden>
    <div class="screen-header">
      <div class="hint" id="title-screen-hint"></div>
      <button id="btn-title-back" class="back-btn" onclick="goHome()"></button>
    </div>
    <div class="row">
      <button id="btn-type-own" onclick="showManualTitle()"></button>
      <button id="btn-suggest-cv" class="secondary" onclick="suggestTitles()"></button>
    </div>

    <div id="manual-title-box" hidden>
      <label for="manual_title" id="manual-title-label"></label>
      <input id="manual_title" />
      <button id="btn-next-title" onclick="pickTitle(document.getElementById('manual_title').value.trim())"></button>
    </div>

    <div id="suggested-titles-box" hidden>
      <div id="title-chips"></div>
      <button id="btn-suggest-again" class="link" onclick="suggestTitles()"></button>
    </div>

    <div id="title-error"></div>
  </div>

  <div id="search-screen" hidden>
    <div class="selected-title">
      <span id="searching-for-label">Searching for <b id="chosen-title-label"></b></span>
      <button id="btn-change-title" class="back-btn" onclick="backToTitleScreen()"></button>
    </div>

    <label for="location" id="location-label"></label>
    <input id="location" />

    <button id="search_btn" onclick="search()"></button>

    <div id="result"></div>
  </div>

  <div id="applications-screen" hidden>
    <div class="screen-header">
      <div class="hint" id="applications-title"></div>
      <button id="btn-applications-back" class="back-btn" onclick="goHome()"></button>
    </div>
    <div class="controls-row" id="applications-controls">
      <select id="applications-filter" onchange="renderApplications()"></select>
      <select id="applications-sort" onchange="renderApplications()"></select>
    </div>
    <div id="applications-list"></div>
    <div id="application-detail" hidden></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>

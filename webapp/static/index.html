<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcceptedAI — Find a Vacancy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }
  h2 { font-size: 18px; margin-bottom: 4px; }
  .hint { color: var(--tg-theme-hint-color, #999999); font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000000);
    font-size: 15px;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  #result { margin-top: 20px; }
  .card {
    border: 1px solid var(--tg-theme-hint-color, #dddddd);
    border-radius: 10px;
    padding: 14px;
  }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .company { color: var(--tg-theme-hint-color, #999999); font-size: 13px; margin-bottom: 8px; }
  .card a { color: var(--tg-theme-link-color, #2481cc); }
  .error { color: #d33; font-size: 14px; }
</style>
</head>
<body>
  <h2 id="greeting">Find a vacancy</h2>
  <div class="hint">Search live job postings matching your CV.</div>

  <label for="job_title">Job title</label>
  <input id="job_title" placeholder="e.g. Data Analyst" />

  <label for="location">Location</label>
  <input id="location" placeholder="e.g. Tashkent, Remote, Europe" />

  <button id="search_btn" onclick="search()">🔍 Search</button>

  <div id="result"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById("greeting").textContent = `Hi ${user.first_name}, find a vacancy`;
      }
    }

    async function search() {
      const jobTitle = document.getElementById("job_title").value.trim();
      const location = document.getElementById("location").value.trim() || "Any";
      const resultEl = document.getElementById("result");
      const btn = document.getElementById("search_btn");

      if (!jobTitle) {
        resultEl.innerHTML = '<div class="error">Enter a job title first.</div>';
        return;
      }
      if (!tg || !tg.initData) {
        resultEl.innerHTML = '<div class="error">Open this from the Telegram bot, not a regular browser.</div>';
        return;
      }

      btn.disabled = true;
      resultEl.innerHTML = '<div class="hint">Searching…</div>';

      try {
        const res = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            init_data: tg.initData,
            job_title: jobTitle,
            location: location,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        renderResult(data.vacancies);
      } catch (err) {
        resultEl.innerHTML = `<div class="error">Search failed: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderResult(vacancies) {
      const resultEl = document.getElementById("result");
      if (!vacancies || vacancies.length === 0) {
        resultEl.innerHTML = '<div class="hint">No matching posting found — try different criteria.</div>';
        return;
      }
      resultEl.innerHTML = vacancies.map(v => `
        <div class="card">
          <h3>${escapeHtml(v.title)}</h3>
          <div class="company">${escapeHtml(v.company)} · ${escapeHtml(v.location)}</div>
          <p>${escapeHtml(v.summary)}</p>
          <a href="${v.url}" target="_blank">View posting →</a>
        </div>
      `).join("");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }
  </script>
</body>
</html>
